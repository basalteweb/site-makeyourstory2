name: makeyourstory
services:
  database:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: makeyourstory
      POSTGRES_USER: makeyourstory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe PostgreSQL MakeYourStory requis}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -d makeyourstory -U makeyourstory]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: production
      APP_BIND: 0.0.0.0
      PORT: 3000
      MEDIA_DIR: /srv/makeyourstory/media
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - media:/srv/makeyourstory/media
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  database:
  media:
