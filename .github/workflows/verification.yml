name: Vérification MakeYourStory
on:
  push:
    branches: [finalisation-plateforme]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: makeyourstory_test
          POSTGRES_USER: mys_test
          POSTGRES_PASSWORD: mys-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d makeyourstory_test -U mys_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Tester PostgreSQL 17 et les migrations
        run: npm test
        env:
          MYS_TEST_DATABASE_URL: postgresql://mys_test:mys-test-only@127.0.0.1:5432/makeyourstory_test
      - name: Démarrer et vérifier la recette isolée
        run: sh bin/recette.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
